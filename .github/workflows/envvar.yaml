name: Environment Variable
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  Env_var:
    build:
      name: Run Script
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v1
        - name: Script
          run: ./script.ps1
          shell: pwsh
          env:
            MyVariable: "Hello World!"